services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: gofundme_demo
    volumes: ["demo-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d gofundme_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  demo-data:
